# Netlify: halaman TV dari public/, data dari Netlify Function (netlify/functions/state.mjs)
# yang melayani /api/state dan /healthz.
# Atur DATABASE_URL, SHEET_URL, PG_QUERY, dll. di Project configuration > Environment variables.
[build]
  publish = "public"
  command = "npm test"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
